# PrimateScope Active-Learning Pilot Configuration

detector:
  architecture_yaml: "/mnt/nas/users/moba/projects/AE_Primate_Detection/worktrees/primate-al-pilot/YOLO-KAN/ultralytics/cfg/models/11/yolo11n-F16.yaml"
  checkpoint_path: "/mnt/nas/users/moba/projects/AE_Primate_Detection/worktrees/primate-al-pilot/experiments/checkpoints/yolo11n_f16_frozen_seed0.pt"
  imgsz: 640
  device: "2"
  conf_threshold: 0.25
  iou_threshold: 0.50

dataset:
  data_yaml: "/mnt/nas/users/moba/projects/AE_Primate_Detection/datasets/nkhotakota/data.yaml"
  index_json: "/mnt/nas/users/moba/projects/AE_Primate_Detection/datasets/nkhotakota/index.json"
  train_manifest: "/home/moba/data/primate_yolo/nkhotakota_train.txt"
  val_manifest: "/home/moba/data/primate_yolo/nkhotakota_val.txt"
  images_dir: "/home/moba/data/primate_yolo/images"
  labels_dir: "/home/moba/data/primate_yolo/labels"

active_learning:
  seed: 42
  initial_budget: 500
  cycle_budget: 250
  total_cycles: 4
  strategy: "proposed"  # "random", "uncertainty", "diversity", "proposed"
  
  # Method specific coefficients
  proposed_weights:
    lambda_d: 0.5            # Foreground diversity weight
    lambda_s: 0.3            # Site balancing weight
    lambda_r: 0.8            # Event redundancy penalty
    cost_epsilon: 0.001      # Division epsilon for cost normalization
    alpha_disagree: 0.4      # Weak/strong prediction disagreement weight
    event_delta_seconds: 60  # Burst grouping interval (seconds)
    cost_base: 1.0           # Base inspection cost proxy per image
    cost_box_weight: 0.0     # Cost proxy per bounding box (0.0 to prevent penalizing multi-animal supervision)
    cost_crowd_weight: 0.5   # Cost proxy for box crowding / occluding overlap
    max_event_quota: 3       # Max frames allowed per event in a single batch
    presence_gating: true    # Gate score by presence probability P(animal in frame)
    presence_floor: 0.10     # Presence probability floor multiplier
    overlap_only_crowd: true # Penalize only overlapping bounding box IoUs

training:
  epochs: 30
  batch: 64
  imgsz: 640
  optimizer: "SGD"
  lr0: 0.01
  patience: 100
  workers: 0
  deterministic: true
  save: true
  project_root: "/mnt/nas/users/moba/projects/AE_Primate_Detection/worktrees/primate-al-pilot/experiments/runs/primate_al_pilot"
  reports_root: "/mnt/nas/users/moba/projects/AE_Primate_Detection/worktrees/primate-al-pilot/experiments/reports/primate_al"
